name: CI

# Lints the add-on config and builds the image for both arches against the
# currently pinned larapaper base. Note: automated bump PRs from
# update-larapaper.yaml do NOT trigger this workflow (they're created with
# GITHUB_TOKEN, which suppresses downstream workflow runs) — that workflow
# runs its own build as the merge gate instead. This CI covers manual PRs
# and pushes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./calendhd-paper

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build add-on (both arches)
        run: |
          tag=$(grep -m1 -o 'larapaper:[0-9][^"[:space:]]*' calendhd-paper/build.yaml | cut -d: -f2)
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" \
              --build-arg "BUILD_FROM=ghcr.io/usetrmnl/larapaper:${tag}" \
              calendhd-paper
          done
