name: calenDHD Paper
version: "1.2.0"
slug: calendhd_paper
description: "Self-hosted TRMNL server (larapaper BYOS) — run your calenDHD e-ink dashboard fully on your LAN"
url: "https://github.com/Bazooper-blip/calendhd-paper"
arch:
  - aarch64
  - amd64
init: false
startup: services
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: "larapaper Web UI & TRMNL device API"
webui: http://[HOST]:[PORT:8080]
options:
  app_url: "http://homeassistant.local:4567"
  registration_enabled: true
schema:
  app_url: str
  registration_enabled: bool
