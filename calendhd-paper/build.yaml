# The addon layers Home Assistant glue on top of the official larapaper image
# (multi-arch: linux/amd64 + linux/arm64 — hence no armv7 in config.yaml).
# Bump the tag here (both arches) to ship a new larapaper version, and record
# it in CHANGELOG.md.
build_from:
  aarch64: ghcr.io/usetrmnl/larapaper:0.40.0
  amd64: ghcr.io/usetrmnl/larapaper:0.40.0
labels:
  org.opencontainers.image.title: "calenDHD Paper"
  org.opencontainers.image.description: "larapaper TRMNL BYOS server as a Home Assistant add-on"
  org.opencontainers.image.source: "https://github.com/Bazooper-blip/calendhd-paper"
  org.opencontainers.image.licenses: "MIT"
